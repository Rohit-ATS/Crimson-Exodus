services:
  - type: web
    name: crimson-exodus
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    buildCommand: npm ci && npm run verify
    startCommand: npm run multiplayer:start
    healthCheckPath: /health
    # Deploy every pushed commit. `checksPass` can leave the live WebSocket
    # protocol behind when a Pages-only GitHub check is not reported to Render.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: ALLOWED_ORIGINS
        value: https://rohit-ats.github.io
      - key: VITE_ROVER_MODE
        value: auto
      - key: VITE_DEEPGRAM_TOKEN_URL
        value: /api/deepgram-token
