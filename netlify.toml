# Netlify: static build, no server, no secrets.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://trek.nasa.gov https://flagcdn.com; connect-src 'self' https://api.deepgram.com wss://api.deepgram.com wss://agent.deepgram.com wss:; media-src 'self'; manifest-src 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self), payment=(), usb=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# The token-minting function must be matched before the catch-all below, or
# the single-page redirect swallows it and the browser gets index.html where it
# expected a token.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: everything else resolves to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
